[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "tower-log"] }
tokio = { version = "1.54.1", features = ["full"] }
redis = { version = "1.8.1", features = ["tokio-comp"] }
tower = { version = "0.5.3", features = ["timeout", "util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
config = { version = "0.15.27", default-features = false }
lettre = "0.11.23"
handlebars = "6.4.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "std"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
chrono = "0.4.45"
dotenvy = "0.15.7"
sha2 = "0.11.1"
user-agent-parser = "0.5.0"


[lib]
name = "api"
path = "src/lib.rs"
